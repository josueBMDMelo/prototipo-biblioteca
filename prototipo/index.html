<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Biblioteca Escolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Biblioteca Escolar</h1>
    <p class="subtitulo">Acesse sua conta</p>

    <form id="form-login" novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Mínimo 6 caracteres">

      <button type="submit" id="btn-entrar">Entrar</button>
    </form>

    <p id="mensagem" class="mensagem"></p>

    <p class="dica">Usuário de teste: <strong>admin@teste.com</strong> / senha <strong>123456</strong></p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
