<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livros - Biblioteca Escolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card largo">
    <h1 id="boas-vindas">Livros cadastrados</h1>

    <nav class="acoes">
      <a href="cadastro.html" id="link-cadastro" class="botao">+ Novo livro</a>
      <button type="button" id="btn-sair" class="secundario">Sair</button>
    </nav>

    <table>
      <thead>
        <tr><th>Título</th><th>Autor</th><th>Ano</th></tr>
      </thead>
      <tbody id="tabela-livros"></tbody>
    </table>

    <p id="lista-vazia" class="dica">Nenhum livro cadastrado ainda.</p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
